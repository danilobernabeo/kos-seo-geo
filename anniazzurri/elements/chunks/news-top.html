  <div class="container" stripe-main-article="">
    <div class="card border-0 mb-3">
      <div class="row g-0 bg-peacock rounded-5">
        <div class="col-lg-6 col-xl-8 order-lg-1">
          <div class="ratio ratio-16x9 bg-cover-center h-100 position-relative">[[immagine? &src=`[[+tv.newsImage]]` &alt=`[[+pagetitle]]` &class=`kos-sfondo` &sizes=`(min-width: 992px) 50vw, 100vw`]]</div>
        </div>
        <div class="col-lg-6 col-xl-4">
          <div class="card-body text-white">
            <p class="card-text"><small>[[+publishedon:strtotime:date=`%d %B %Y`]]</small></p>
            <h3 class="card-title">[[+pagetitle]]</h3>
            <p class="mt-4 mb-0 card-description">[[+introtext]]</p>
            <div>
              <a href="[[~[[+id]]]]" class="mt-lg-5 mt-4 btn btn-outline-white">Leggi di più</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
