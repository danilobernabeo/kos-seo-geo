<div card-news="" class="col-12 col-lg-4">
  <div class="card border-0 shadow">
    [[immagine? &src=`[[+newsImage]]` &alt=`[[+pagetitle]]` &class=`card-img-top` &sizes=`(min-width: 992px) 33vw, (min-width: 768px) 50vw, 100vw`]]
    <div class="card-body">
      <h4 class="card-title text-primary mb-3">[[+pagetitle]]</h4>
      <p class="card-text text-brown">[[+introtext]]</p>
    </div>
    <div class="card-footer">
      <a href="[[~[[+id]]]]" class="text-uppercase text-azure">
        Leggi di più<i class="bi bi-chevron-right ps-2"></i>
      </a>
    </div>
  </div>
</div>
