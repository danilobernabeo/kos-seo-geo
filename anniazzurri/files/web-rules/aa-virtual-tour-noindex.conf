# Virtual tour delle residenze (/assets/virtual-tour/<residenza>/index.html): pagine HTML di sole 7 parole, oggi
# indicizzabili e tenute fuori dall'indice solo dal canonical verso la scheda (rilievo N9, Screaming Frog 18/11).
# Da incollare nelle regole web del pannello MODX Cloud insieme agli altri blocchi «location ~*» (prima di «location / {»).
# Le add_header dentro una location annullano quelle del server: si ripetono gli header di sicurezza del sito.
location ~* ^/assets/virtual-tour/.+\.html$ {
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Referrer-Policy 'strict-origin-when-cross-origin';
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Robots-Tag "noindex, follow";
}
