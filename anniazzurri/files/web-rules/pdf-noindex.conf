    if ($uri = "/assets/doc/anniazzurri-a-casa-servizio-di-assistenza-domiciliare.pdf") { set $pdf_robots ""; }
    if ($uri = "/assets/doc/benessere-mentale-in-rsa.pdf") { set $pdf_robots ""; }
