# === Compressione: a livello di server vale anche per le pagine generate da MODX ===
# (prima era dentro "location /", dove non si applicava alle pagine PHP)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/x-javascript application/json application/manifest+json application/xml application/rss+xml application/atom+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml image/x-icon;

# === Reindirizzamenti in un solo passaggio: www (o altro host) -> anniazzurri.it, http -> https ===
# La destinazione viene solo CALCOLATA qui. Il redirect avviene dentro le location, dopo i
# redirect dei vecchi URL: cosi' un vecchio URL in http o con www va subito alla pagina finale.
set $redirect_to "";
if ($host != "anniazzurri.it") {
    set $redirect_to "https://anniazzurri.it$request_uri";
}
if ($scheme != "https") {
    set $redirect_to "https://anniazzurri.it$request_uri";
}

# Rete di sicurezza per gli script PHP gestiti dalla piattaforma: redirect immediato
set $redirect_check "$redirect_to|$uri";
if ($redirect_check ~ "^https://[^|]+\|.*\.php$") {
    return 301 $redirect_to;
}

# === Cache del browser per i file statici ===
# Senza "add_header" qui dentro, cosi' anche questi file ricevono gli header di sicurezza.
# Immagini, font e video: cambiano raramente
location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mov|mp3)$ {
    if ($redirect_to) { return 301 $redirect_to; }
    expires 30d;
    access_log off;
}

# CSS e JS: durata piu' breve, perche' il nome del file non cambia tra una versione e l'altra
location ~* \.(?:css|js)$ {
    if ($redirect_to) { return 301 $redirect_to; }
    expires 7d;
    access_log off;
}

# PDF (carte dei servizi, moduli): vengono aggiornati mantenendo lo stesso nome
location ~* \.pdf$ {
    if ($redirect_to) { return 301 $redirect_to; }
    expires 1d;
}

# === Vecchi URL ===
location = /residenza-anni-azzurri-villa-olga {
    return 301 https://anniazzurri.it/residenza-anni-azzurri-idice;
}
location = "/assets/doc/strutture/residenza-anni-azzurri-villa-olga/Carta dei servizi.pdf" {
    return 301 "https://anniazzurri.it/assets/doc/strutture/residenza-anni-azzurri-idice/Carta%20dei%20servizi.pdf";
}

