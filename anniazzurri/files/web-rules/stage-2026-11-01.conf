# === Cache del browser per i file statici ===
# Senza "add_header" qui dentro, cosi' anche questi file ricevono gli header di sicurezza.
# Immagini, video e audio: cambiano raramente (6 mesi, voce AA-14)
location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|mp4|webm|mov|mp3)$ {
    expires 180d;
    access_log off;
}

# Font: 1 anno (voce AA-14)
location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 365d;
    access_log off;
}

# CSS e JS: durata piu' breve, perche' il nome del file non cambia tra una versione e l'altra
location ~* \.(?:css|js)$ {
    expires 180d;
    access_log off;
}

# Icone con varianti di misura
location ~ ^/apple-touch-icon(-\d+x\d+)?(-precomposed)?\.png$ {
    try_files /dist/assets/apple-touch-icon.png =404;
}

# === Vecchi URL ===
location = /residenza-anni-azzurri-villa-olga {
    return 301 $scheme://$host/residenza-anni-azzurri-idice;
}
location = "/assets/doc/strutture/residenza-anni-azzurri-villa-olga/Carta dei servizi.pdf" {
    return 301 "$scheme://$host/assets/doc/strutture/residenza-anni-azzurri-idice/Carta%20dei%20servizi.pdf";
}

# ===== INIZIO SEZIONE PDF — VARIANTE STAGE (senza $redirect_to) (KOS-8 / AA-3) — generata il 2026-11-01 da scripts/pdf/genera-piano-pdf.py: non modificare a mano, si rigenera =====
# Gestita dalla chat dei PDF. Da incollare nelle regole web del pannello MODX Cloud PRIMA del blocco «location / {».
# Tre parti: 1) redirect di singoli PDF; 2) un solo blocco per tutti i PDF: X-Robots-Tag noindex di default, indicizzabili solo i PDF
# dell'elenco (192), Link rel="canonical" per le 24 copie identiche; 3) niente robots.txt: Google deve poter rileggere l'intestazione.
# Ripristino: togliere tutto da INIZIO a FINE; i PDF tornano come prima (tutti indicizzabili, senza intestazioni).

# --- 1. Redirect di singoli PDF (location esatte, vincono sul blocco regex) ---
# residenza chiusa il 19/10: la pagina rimanda a /rsa-nelle-marche e non esiste una carta equivalente
location = "/assets/doc/strutture/residenza-anni-azzurri-villalba/Carta dei servizi.pdf" { return 301 "$scheme://$host/rsa-nelle-marche"; }
# stesso documento (PARM) della stessa residenza, edizione 2025 (come PARS 2022 → PARS 2025)
location = "/assets/doc/strutture/residenza-anni-azzurri-parco-di-veio/PARM 2024.pdf" { return 301 "$scheme://$host/assets/doc/strutture/residenza-anni-azzurri-parco-di-veio/PARM 2025.pdf"; }
# la cartella non ha più documenti: alla pagina della residenza. ATTIVARE SOLO se la pagina risponde 200 (curl -I)
#location = "/assets/doc/strutture/residenza-anni-azzurri-biarella/Carta dei servizi.pdf" { return 301 "$scheme://$host/residenza-anni-azzurri-biarella"; }

# --- 2. Tutti i PDF: noindex tranne quelli in elenco; canonical per i duplicati ---
# Le add_header dentro una location annullano quelle del server: si ripetono qui gli header di sicurezza del sito.
# ATTENZIONE: nelle regole di anniazzurri.it esiste già un blocco «location ~* \.pdf$ { ... expires 1d; }» (sezione «Cache del browser»).
# Con due blocchi regex uguali nginx usa solo il primo: va CANCELLATO quel blocco e al suo posto vale questo (che mantiene expires 1d).
location ~* \.pdf$ {
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Referrer-Policy 'strict-origin-when-cross-origin';
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    expires 1d;
    set $pdf_robots "noindex";
    set $pdf_link "";
    # --- per nome file (senza distinzione di maiuscole): i tipi da tenere restano indicizzabili anche con un nome nuovo ---
    # carta dei servizi / carta degli alloggi
    if ($uri ~* "/[^/]*cart[ae][ _-]+(dei|degli)[ _-]+(servizi|alloggi)[^/]*\.pdf$") { set $pdf_robots ""; }
    # pieghevole / leaflet
    if ($uri ~* "/[^/]*(pieghevole|leaflet)[^/]*\.pdf$") { set $pdf_robots ""; }
    # guida utente / user manual / guida ai servizi
    if ($uri ~* "/[^/]*(guida[ _-]+(utente|ai[ _-]+servizi)|user[ _-]*(manual|guide))[^/]*\.pdf$") { set $pdf_robots ""; }
    # preparazioni
