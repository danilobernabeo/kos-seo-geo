# Icone del sito: varianti con le misure di apple-touch-icon (-120x120, -152x152, -240x240..., con o senza -precomposed)
# servite con l'icona esistente; le due senza misura sono già file nella radice (19/10). Prima dei blocchi location.
location ~ ^/apple-touch-icon(-\d+x\d+)?(-precomposed)?\.png$ {
    try_files $uri /dist/assets/apple-touch-icon.png =404;
}
