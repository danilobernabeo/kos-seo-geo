  # Redirect generico (www/http) per tutte le altre pagine
  if ($redirect_to) { return 301 $redirect_to; }

  # URL "annidati" inventati dai crawler (es. /residenza-x/news/...): tutte le pagine del sito
  # hanno indirizzi a un solo livello, quindi un indirizzo a piu' livelli fuori dalle cartelle
  # tecniche riceve subito un 404 da nginx, senza passare da PHP (31/10/2026).
  # I file veri con estensione (immagini, css, js, pdf, font) hanno location proprie e non arrivano qui.
  if ($uri ~ "^/(?!assets/|dist/|manager/|connectors/|core/|setup/|\.well-known/)[^/]+/[^/]") { return 404; }

  try_files $uri $uri/ @modx-rewrite;
}

