# anniazzurri.it — regole web MODX Cloud (pannello > Web Rules), voce AA-14
# CSS e JS a 60 giorni: i link a /dist/css/*.css non hanno parametro di versione.
location ~* \.(?:css|js|mjs)$ {
    expires 60d;
}
location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico)$ {
    expires 180d;
}
location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 365d;
}
