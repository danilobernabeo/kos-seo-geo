<script>
(function () {
  var form = document.getElementById('oss-lombardia');
  if (!form) return;

  form.addEventListener('submit', function (e) {
    // Se è già in corso un submit, blocca tutto
    if (form.dataset.submitting === '1') {
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }

    // Valida manualmente prima di bloccare
    if (!form.checkValidity()) return; // lascia che il browser mostri gli errori nativi

    // Blocca submit successivi
    form.dataset.submitting = '1';

    // Disabilita il bottone e cambia testo
    var btn = form.querySelector('button[type="submit"], button:not([type])');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>' +
        'Invio in corso…';
      btn.style.opacity = '0.75';
      btn.style.cursor  = 'not-allowed';
    }
  });
})();
</script>
