<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[*longtitle:isempty=`[[*pagetitle]]`]] | Anni Azzurri</title>
  [[*searchable:is=`0`:then=`<meta name="robots" content="noindex, follow">`]]
  <meta name="description" content="[[*description]]">
  [[!Canonical]]
  <base href="[[!++site_url]]">
  [[$GTM_head]]

    <meta property="og:type" content="article">
    <meta property="og:title" content="[[*pagetitle]]">
    <meta property="og:description" content="[[*description]]">
    <meta property="og:image" content="[[++site_url]][[*newsImage]]?v=[[*editedon:strtotime]]">
    <meta property="og:image:width" content="980">
    <meta property="og:image:height" content="551">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="[[*pagetitle]]">
    <meta property="og:url" content="[[!++site_url]][[*alias]]">
    <meta property="og:site_name" content="Anni Azzurri">
    <meta property="og:locale" content="it_IT">
    <meta property="article:published_time" content="[[*publishedon:date=`%Y-%m-%dT%H:%M:%S%z`]]">

  <link rel="apple-touch-icon" sizes="180x180" href="/dist/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/dist/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/dist/assets/favicon-16x16.png">
  <link rel="manifest" href="/dist/assets/site.webmanifest">
  <link rel="mask-icon" href="/dist/assets/safari-pinned-tab.svg" color="#003d7c">
  <link rel="shortcut icon" href="/dist/assets/favicon.ico">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="/dist/assets/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/dist/css/app.css">
  <link rel="stylesheet" href="/dist/css/custom.css">

</head>
