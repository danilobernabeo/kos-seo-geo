<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[*longtitle:isempty=`[[*pagetitle]]`]] | Anni Azzurri</title>
  <meta name="description" content="[[*description]]">
  [[!Canonical]]
  <base href="[[!++site_url]]">
  [[$GTM_head]]
  <meta property="og:type" content="website">
  <meta property="og:title" content="[[*pagetitle]]">
  <meta property="og:description" content="[[*description]]">
  <meta property="og:image" content="[[!++site_url]]assets/img/[[*alias]].jpg">
  <meta property="og:url" content="[[!++site_url]][[*alias]]">

  <link rel="apple-touch-icon" sizes="180x180" href="/dist/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/dist/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/dist/assets/favicon-16x16.png">
  <link rel="manifest" href="/dist/assets/site.webmanifest">
  <link rel="mask-icon" href="/dist/assets/safari-pinned-tab.svg" color="#003d7c">
  <link rel="shortcut icon" href="/dist/assets/favicon.ico">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="/dist/assets/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/dist/css/app.css">
  <link rel="stylesheet" href="/dist/css/custom.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  

  <script>
		$(function() {
		    
			$("#ecm_prof_id").change(function() {
			var prof = $('#ecm_prof_id').val();
			$("#ecm_disc_id").select("val", "");

		    if(prof > 0 && prof < 31)
			    {
						$("#ecm_disc_id").load("specdataka/" + $(this).val() + ".txt");
						$("#ecm_disc_id").attr('required', true);
						$("#specdiv").show();
			}
			else
			    {
			    		$("#ecm_disc_id").select("val", "");
			    		$("#ecm_disc_id").attr('required', false);
						$("#specdiv").hide();
			}

			});

		});

		$(document).ready(function(){
		$("#specdiv").hide();
		});
	</script>

    <script>
        $(function() {
            
            $("#reclutato").change(function() {
            var org = $('#reclutato').val();

            if(org == 'Si')
                {
                        $("#org_reclutatore").attr('required', true);
                        $("#recdiv").show();
            }
            else
                {
                        $("#org_reclutatore").attr('required', false);
                        $("#recdiv").hide();
            }

            });

        });

        $(document).ready(function(){
        $("#recdiv").hide();
        });
    </script>

</head>
