<div heading="" class="hero-picture position-relative overflow-hidden" stripe-one-col-media-component="">

  <picture class="hero-media">
    <source media="(min-width:992px)" srcset="/assets/img/[[*alias]].jpg">
    <source media="(max-width:991px)" srcset="/assets/img/[[*alias]]-mb.jpg">
    <img src="/assets/img/[[*alias]].jpg" alt="[[*pagetitle]]" fetchpriority="high">
  </picture>

  <div class="overlay"></div>

  <div class="container position-relative">
    <div class="row content-container align-items-center" style="padding-top: 0; padding-bottom: 0; color: #FFF">
      <div class="col-10 col-md-8 col-lg-6 text-white">
        <h1>[[*pagetitle]]</h1>
        <p>[[*introtext]]</p>
      </div>
    </div>
  </div>

</div>
