<style>
  .video-section {
    background: #ffffff;

    margin-bottom: 10px;
  }

  .video-section .video-title {
    font-size: clamp(1.2rem, 2.5vw, 1.6rem);

    margin: 0 auto 28px;
    max-width: 640px;
    line-height: 1.3;
    letter-spacing: -0.01em;

  .video-wrapper {

    max-width: 720px;

    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.13);
  }

  .video-wrapper::before {
    content: '';

    padding-top: 56.25%;

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
