<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.carousel-cell').forEach(function(cell) {
        var sync = function() {
            cell.toggleAttribute('inert', cell.getAttribute('aria-hidden') === 'true');
        };
        new MutationObserver(sync).observe(cell, { attributes: true, attributeFilter: ['aria-hidden'] });
        sync();
    });
});
</script>
