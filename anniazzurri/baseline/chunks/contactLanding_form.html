<div class="row mt-5">

	<form  id="[[*longtitle]]" action="[[~[[*id]]]]" method="post" class="content-left text-brown col-12">
	<input type="hidden" name="nospam:blank" />
	
    <div class="mb-3 row g-4">
	
       <div class="col-12 col-md-6">
        <label class="form-label" for="name">Nome*</label>
        <input class="form-control form-control-lg" id="name" name="name" type="text" required />
       </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="surname">Cognome*</label>
            <input class="form-control form-control-lg" id="surname" name="surname" type="text" required />
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="email">Email*</label>
            <input class="form-control form-control-lg" id="email" name="email"  type="email" required />
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="email">Cellulare*</label>
            <input class="form-control form-control-lg" id="cellulare" name="cellulare"  type="cellulare" required />
        </div>

    </div>
	
    <div class="row mb-2 mt-2">
	   <div class="col-12 xcol-lg-6">
            <div class="form-check">
                <input class="form-check-input" id="privacy" name="privacy" type="checkbox" value="accetto" required />
                <label class="form-check-label small" for="privacy">Ho letto l'<a class="text-azure text-decoration-underline" href="/assets/doc/KOS-Care_GDPR_Informativa.pdf" target="_blank">Informativa sul trattamento dei miei dati personali</a> ed acconsento alla loro elaborazione nelle formule espresse:</label>
            </div>
        </div>
    </div>

	<div class="row">
    	<div class="col-12 xcol-lg-6">
            <div class="form-check">
                <input class="form-check-input" name="promotion" type="checkbox" value="accetto" />
                <label class="form-check-label small" for="promotion">Inviatemi messaggi informativi e promozionali.</label>
            </div>
        
            <button class="mt-lg-5 mt-4 btn btn-primary">CONTATTTEMI</button></form>
        </div>
    </div>
</div>
