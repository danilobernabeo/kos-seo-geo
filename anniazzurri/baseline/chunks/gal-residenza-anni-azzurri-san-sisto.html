<!-- PHOTO CAROUSEL ========================================================= -->
<div stripe-photo-carousel class="container my-4 my-md-5">
  <div class="row">
    <!-- Titolo sezione -->
    <div class="col-lg-4 my-lg-5">
      <h3 class="text-primary fw-semibold">
        Scopri le foto della residenza
      </h3>

      <!-- Descrizione (solo per tecnologie assistive) -->
      <p id="photo-desc" class="visually-hidden">
        Dodici foto della Residenza San Sisto: esterni, spazi comuni,
        camere e giardino.
      </p>

      <!-- Pulsante che apre la galleria -->
      <a href="#"
         class="text-uppercase text-brown fw-semibold text-decoration-none d-inline-flex align-items-center"
         role="button"
         data-bs-toggle="modal"
         data-bs-target="#photo-modal"
         aria-label="Apri galleria fotografica della Residenza San Sisto"
         aria-describedby="photo-desc">
        Guarda tutte le foto <i class="bi bi-chevron-right ms-1" aria-hidden="true"></i>
      </a>
    </div>

    <!-- Anteprime desktop (background-image, decorative) -->
    <div class="col-8 d-none d-lg-block">
      <div class="parent" role="button"
           data-bs-toggle="modal"
           data-bs-target="#photo-modal"
           aria-label="Apri galleria fotografica della Residenza San Sisto">
        <div class="div1 rounded-3 bg-cover-center"
             style="background-image:url('/assets/img/strutture/[[*alias]]/sansisto_IMG_6564.jpg')"
             aria-hidden="true"></div>

        <div class="div2 rounded-3 bg-cover-center"
             style="background-image:url('/assets/img/strutture/[[*alias]]/sansisto_IMG_6592.jpg')"
             aria-hidden="true"></div>

        <div class="div3">
          <div class="rounded-3 bg-cover-center"
               style="background-image:url('/assets/img/strutture/[[*alias]]/sansisto_IMG_6657.jpg')"
               aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CAROUSEL MOBILE ------------------------------------------------------ -->
  <div class="row d-lg-none pb-5">
    <div class="col-12">
      <div class="photo-carousel"
           data-flickity='{ "cellAlign":"left","contain":true,"adaptiveHeight":true,"prevNextButtons":false }'>

        <!-- Ogni immagine è decorativa: alt="" -->
        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6564.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6592.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6657.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6687.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6716.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6726.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST01.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST02.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST03.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST04.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST05.jpg" class="img-fluid" alt="">
        </div>

        <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
          <img src="/assets/img/strutture/[[*alias]]/SST06.jpg" class="img-fluid" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CON CAROUSEL FULLSCREEN --------------------------------------- -->
  <div class="modal fade" id="photo-modal" tabindex="-1"
       aria-hidden="true" aria-describedby="photo-desc">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-semibold text-primary">
            Scopri le foto della residenza
          </h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>

        <div class="modal-body mb-4">
          <div class="photo-carousel"
               data-flickity='{ "cellAlign":"left","contain":true,"adaptiveHeight":true,"prevNextButtons":true }'>

            <!-- Stesso set di immagini, sempre decorative -->
            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6564.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6592.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6657.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6687.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6716.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/sansisto_IMG_6726.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST01.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST02.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST03.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST04.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST05.jpg" class="img-fluid" alt="">
            </div>

            <div class="carousel-cell w-100 px-0 d-flex justify-content-center">
              <img src="/assets/img/strutture/[[*alias]]/SST06.jpg" class="img-fluid" alt="">
            </div>

          </div><!-- /.photo-carousel -->
        </div><!-- /.modal-body -->
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->
</div><!-- /.container -->
