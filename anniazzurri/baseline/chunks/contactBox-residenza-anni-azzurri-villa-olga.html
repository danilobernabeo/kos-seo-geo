<div class="contacts col-lg-5 col-xl-4 mb-4 mb-lg-0">
  <div class="card h-auto bg-ice text-primary border-0">
    <div class="card-body p-3 p-lg-4">
      <h5 class="card-title">Contatti</h5>
      <div class="card-text d-flex align-items-start">
        <i class="text-azure bi bi-geo-alt"></i>
        <div class="content-right ps-2 pb-3">
          <span class="font-weight-600" >[[*pagetitle]]</span>
          <br>Via Carlo Francesco Dotti 2/2<br>41135 Bologna BO
        </div>
      </div>
      <div class="card-text d-flex align-items-start">
        <i class="text-azure bi bi-envelope"></i>
        <div class="content-right ps-2 pb-3 text-truncate">
          <a class="font-weight-600 text-decoration-underline" href="mailto:[[*emailResidenza]]">[[*emailResidenza]]</a>
        </div>
      </div>
      <div class="card-text d-flex align-items-start">
        <i class="text-azure bi bi-person"></i>
        <div class="content-right ps-2 pb-3 text-truncate">
          <a class="font-weight-600 text-decoration-underline" href="mailto:[[*emailDirettore]]">[[*emailDirettore]]</a>
       </div>
      </div>
      <div class="card-text d-flex align-items-start pb-3">
        <i class="text-azure bi bi-telephone"></i>
        <div class="content-right ps-2">
          <a class="text-decoration-none" href="tel:[[*numTel]]">[[*numTel]]</a>
        </div>
      </div>
      <div class="card-text d-flex align-items-start pb-3">
        <i class="text-azure bi bi-printer"></i>
        <div class="content-right ps-2">
          <a class="text-decoration-none" href="tel:051 5875070">051 5875070</a>
        </div>
      </div>
      <a href="contatti" class="btn btn-outline-primary">VUOI ESSERE RICONTATTATO?</a>
    </div>
  </div>
</div>
