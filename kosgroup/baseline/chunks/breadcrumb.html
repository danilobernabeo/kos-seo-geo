[[pdoCrumbs?

    &showHidden=`0`
    &exclude=`253`
    &tpl=`@INLINE [[+hidemenu:is=`1`:then=`[[+pagetitle]]`:else=`<a href="[[+link]]">[[+menutitle]]</a>`]]`

]]
