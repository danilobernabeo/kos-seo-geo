<div id="intro-pagina-img2">
    [[*infoImage:notempty=`<img src="[[*infoImage]]" alt="[[*pagetitle]]" class="responsive-img">`]]
</div>

<style>
#intro-pagina-img2 {
   width: 100%;
   height: 376px;
   overflow: hidden;
   border-radius: 5px;
   margin-bottom: 24px; /* margine inferiore */
}

#intro-pagina-img2 .responsive-img {
   width: 100%;
   height: 100%;
   object-fit: cover;
   object-position: center;
}

@media (max-width: 767px) {
   #intro-pagina-img2 {
       width: 100%;
       max-width: 516px;
       height: 0;
       padding-bottom: 100%;
       margin: 0 auto 24px; /* margine inferiore mantenuto anche in mobile */
       position: relative;
       border-radius: 5px;
   }
   
   #intro-pagina-img2 .responsive-img {
       position: absolute;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
   }
}
</style>
