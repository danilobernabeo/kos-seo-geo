<!-- =================== BOX STRUTTURE START ===================== -->
<section id="strutture-ricerca-filtri" data-aos="fade-up">
   <div class="container">
       <div class="row">
           <div class="titolo-sezione titolo-con-sep">
               <h3>Le nostre strutture con servizi di <span>[[*introtext]]</span></h3>
           </div>
       </div>
       <!-- Aggiunta barra di ricerca -->
       <div class="row mb-4">
          <div class="col-12 d-flex align-items-center">
              <label for="struttureInput" class="me-2 mb-0">Cerca:</label>
               <input class="form-control" 
                      type="text" 
                      id="struttureInput"
                      name="struttureInput" 
                      placeholder="Cerca una struttura per nome o indirizzo" 
                      title="Cerca una struttura">
           </div>
       </div>
       <!-- Aggiunto div per nessun risultato -->
       <div id="struttureNoResults" class="col-12 text-center" style="display: none;">
           <p>Nessuna corrispondenza trovata</p>
       </div>
       <div class="row">    
           <div class="col-12">
               <div class="strutture-box">
                   <div class="results row" id="struttureGrid">
                       [[+wrapper]]
                   </div>
               </div>
           </div>
       </div> 
   </div>
   <!-- Aggiunto script di ricerca aggiornato -->
   <script>
   document.addEventListener("DOMContentLoaded", function() {
       // Collega l'evento keyup all'input di ricerca strutture
       var struttureInput = document.getElementById("struttureInput");
       if (struttureInput) {
           struttureInput.addEventListener("keyup", cercaStrutture);
       }
       
       // Definizione della funzione cercaStrutture con controlli di sicurezza
       function cercaStrutture() {
           var input = document.getElementById("struttureInput");
           var noResults = document.getElementById("struttureNoResults");
           
           // Verifica che gli elementi esistano prima di procedere
           if (!input || !noResults) {
               console.log("Elementi di ricerca strutture non trovati");
               return; // Esci dalla funzione se gli elementi non esistono
           }
           
           var filter = input.value.toUpperCase();
           var cards = document.getElementsByClassName("struttura-card");
           var visibleCards = 0;
           
           // Verifica che cards sia una collezione valida
           if (cards && cards.length > 0) {
               for (var i = 0; i < cards.length; i++) {
                   var card = cards[i];
                   if (card) {
                       // Utilizza querySelector per maggiore robustezza
                       var title = card.querySelector("h4");
                       var address = card.querySelector("p");
                       
                       // Verifica che gli elementi esistano prima di accedere al testo
                       var txtValue = title ? (title.textContent || title.innerText) : "";
                       var addressValue = address ? (address.textContent || address.innerText) : "";
                       
                       if (txtValue.toUpperCase().indexOf(filter) > -1 || addressValue.toUpperCase().indexOf(filter) > -1) {
                           card.style.display = "";
                           visibleCards++;
                       } else {
                           card.style.display = "none";
                       }
                   }
               }
           }
           
           // Mostra/nascondi il messaggio "nessun risultato" solo se l'elemento esiste
           if (noResults) {
               noResults.style.display = visibleCards === 0 ? "block" : "none";
           }
       }
       
       // Esegui una ricerca iniziale (se c'è già un valore nell'input)
       if (struttureInput && struttureInput.value.trim() !== "") {
           cercaStrutture();
       }
   });
   </script>
</section>
<!-- =================== BOX STRUTTURE END ===================== -->
