<section id="strutture-correlate" data-aos="fade-up">
   <div class="container">
       <div class="row">
           <div class="titolo-sezione titolo-con-sep">
               <h3>Le nostre strutture a cui rivolgersi</h3>
           </div>
       </div>
       <!-- Aggiunta barra di ricerca -->
       <div class="row mb-4">
          <div class="col-12 d-flex align-items-center">
              <label for="struttureInput" class="me-2 mb-0">Cerca:</label>
               <input class="form-control" 
                      type="text" 
                      id="struttureInput" 
                      name="struttureInput" 
                      onkeyup="cercaStrutture()" 
                      placeholder="Cerca una struttura per nome, regione o indirizzo" 
                      title="Cerca una struttura">
           </div>
       </div>
       <!-- Aggiunto div per nessun risultato -->
       <div id="noResults" class="col-12 text-center" style="display: none;">
           <p>Nessuna corrispondenza trovata</p>
       </div>
       <div class="row">    
           <div class="col-12 col-lg-9">
               <div class="strutture-box">
                   <div class="results row" id="struttureGrid">
                    [[!getResources?
                       &resources=`[[*mapServiziStrutture]]`
                       &tpl=`@INLINE 
                           <div class="col-12 col-md-6 col-lg-4 struttura-card">
                               <a href="[[+uri]]" class="struttura-container">
                                   <div class="struttura-img">
                                       <img src="/assets/img/strutture/[[+alias]].jpg" alt="" loading="lazy">
                                   </div>
                                   <div class="struttura-content mb-3 mb-md-4">
                                       <h4>[[+pagetitle]]</h4>
                                       <address>[[+indirizzo_struttura]]</address>
                                       <input type="hidden" class="regione-hidden" name="regione" value="[[+regione]]">
                                   </div>
                               </a>
                           </div>
                       `
                       &includeTVs=`1`
                       &processTVs=`1`
                       &tvPrefix=``
                       &sortby=`pagetitle`
                       &sortdir=`ASC`
                       &limit=`0`
                    ]]
                    </div>
               </div>
           </div>
       </div> 
   </div>
   <!-- Aggiunto script di ricerca aggiornato -->
   <script>
    function cercaStrutture() {
        // Prendi l'input di ricerca
        var input = document.getElementById("struttureInput");
        var filter = input.value.toUpperCase();
        var cards = document.getElementsByClassName("struttura-card");
        var noResults = document.getElementById("noResults");
        var visibleCards = 0;

        // Loop attraverso tutte le cards
        for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var title = card.getElementsByTagName("h4")[0];
            var address = card.getElementsByTagName("address")[0];
            var regione = card.getElementsByClassName("regione-hidden")[0];
            
            var txtValue = title.textContent || title.innerText;
            var addressValue = address.textContent || address.innerText;
            var regioneValue = regione ? regione.value : '';

            if (txtValue.toUpperCase().indexOf(filter) > -1 || 
                addressValue.toUpperCase().indexOf(filter) > -1 ||
                regioneValue.toUpperCase().indexOf(filter) > -1) {
                card.style.display = "";
                visibleCards++;
            } else {
                card.style.display = "none";
            }
        }

        // Gestione messaggio "nessun risultato"
        noResults.style.display = (visibleCards === 0) ? "block" : "none";
    }
   </script>
</section>
