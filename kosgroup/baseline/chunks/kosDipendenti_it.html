[[kosSostenibilitaRisorse]]
<div class="box-infografica col-12 col-lg-5" data-aos="fade-up">
    <div class="box-infog-content box-infog-bordered">
        <div class="box-infog-titolo">
            I nostri dipendenti
        </div>

        <div class="box-infog-grafico kos-chart" data-kos-chart="dip">

            <!-- Tab: stesso markup e stile Bootstrap di prima, senza data-bs-toggle (li gestisce kos-chart.js) -->
            <ul class="nav nav-pills nav-grafico" role="tablist" aria-label="Area geografica">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" type="button" role="tab" aria-selected="true" aria-controls="kos-chart-dip-panel" data-kos-series="tutti">Tutti</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" type="button" role="tab" aria-selected="false" aria-controls="kos-chart-dip-panel" data-kos-series="ita" tabindex="-1">ITA</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" type="button" role="tab" aria-selected="false" aria-controls="kos-chart-dip-panel" data-kos-series="ger" tabindex="-1">GER</button>
              </li>
            </ul>

            <div class="kos-chart__plot" id="kos-chart-dip-panel" role="tabpanel">
                <div class="kos-chart__grid" aria-hidden="true"></div>
                <div class="kos-chart__cols"></div>
            </div>

            <ul class="kos-chart__legend">
                <li style="--dot: var(--c-women)">Dipendenti donne</li>
                <li style="--dot: var(--c-men)">Dipendenti uomini</li>
            </ul>

            <table class="kos-sr-only">[[kosChartDipendenti? &resource=`54` &output=`table` &lang=`it`]]</table>

            <script type="application/json">[[kosChartDipendenti? &resource=`54`]]</script>
        </div>

    </div>
</div>
