# kosgroup.com — regole web MODX Cloud (pannello > Web Rules), voce KOS-3
# Solo "expires": niente add_header, che dentro una location annullerebbe
# le intestazioni impostate a livello di server (es. sicurezza).
location ~* \.(?:css|js|mjs)$ {
    expires 180d;
}
location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico)$ {
    expires 180d;
}
location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 365d;
}
