# KOS-8 — cartelle di documenti richieste dai crawler (Bingbot, GPTBot) che oggi rispondono 403 (indice della cartella
# vietato): 301 alla pagina della struttura. Solo l'indirizzo esatto della cartella; i PDF al suo interno non cambiano.
# Da incollare nelle regole web del pannello MODX Cloud, prima dei blocchi "location" esistenti.
location = /assets/doc/strutture/villa-sant-alessandro/ {
    return 301 https://kosgroup.com/it/centri/villa-sant-alessandro;
}
location = /assets/doc/strutture/villa-san-giuseppe/storico-liste-di-attesa/ {
    return 301 https://kosgroup.com/it/centri/villa-san-giuseppe/storico-liste-di-attesa;
}
