# ===== INIZIO SEZIONE PDF — VARIANTE STAGE (senza $redirect_to) (KOS-8 / AA-3) — generata il 2026-11-01 da scripts/pdf/genera-piano-pdf.py: non modificare a mano, si rigenera =====
# Gestita dalla chat dei PDF. Da incollare nelle regole web del pannello MODX Cloud PRIMA del blocco «location / {».
# Tre parti: 1) redirect di singoli PDF; 2) un solo blocco per tutti i PDF: X-Robots-Tag noindex di default, indicizzabili solo i PDF
# dell'elenco (245), Link rel="canonical" per le 15 copie identiche; 3) niente robots.txt: Google deve poter rileggere l'intestazione.
# Ripristino: togliere tutto da INIZIO a FINE; i PDF tornano come prima (tutti indicizzabili, senza intestazioni).

# --- 1. Redirect di singoli PDF (location esatte, vincono sul blocco regex) ---
# nessun documento equivalente (il modulo DSM e la carta dei servizi hanno altro contenuto): alla scheda della struttura
location = "/assets/doc/strutture/villa-rosa/informazioni-per-il-ricovero.pdf" { return 301 "$scheme://$host/it/centri/villa-rosa"; }
# stesso documento (Piano annuale per la gestione del rischio sanitario 2025 = PARS 2025) rinominato
location = "/assets/doc/strutture/poliambulatorio-villalba/piano-annuale-per-la-gestione-del-rischio-sanitario-2025.pdf" { return 301 "$scheme://$host/assets/doc/strutture/poliambulatorio-villalba/pars-2025.pdf"; }
# carta dei servizi di Villa Pineta Riabilitazione, edizione del 14/10/2026 con il nome nuovo
location = "/assets/doc/strutture/villa-pineta/carta-dei-servizi-centro-di-riabilitazione.pdf" { return 301 "$scheme://$host/assets/doc/strutture/villa-pineta/carta-dei-servizi.pdf"; }
# stesso documento (prestazioni della sede di Modena) rinominato «attività»
location = "/assets/doc/strutture/poliambulatorio-villa-pineta/prestazioni-poliambulatorio-villa-pineta-modena.pdf" { return 301 "$scheme://$host/assets/doc/strutture/poliambulatorio-villa-pineta/attivita-poliambulatorio-villa-pineta-modena.pdf"; }
# stesso documento rinominato (dellumore → dell-umore)
location = "/assets/doc/strutture/ville-di-nozzano/disturbi-dellumore-e-di-personalita.pdf" { return 301 "$scheme://$host/assets/doc/strutture/ville-di-nozzano/disturbi-dell-umore-e-di-personalita.pdf"; }
# nessun documento equivalente (le sintesi cliniche RSA e SUAP sono per altri percorsi): alla scheda della struttura
location = "/assets/doc/strutture/centro-residenziale-santo-stefano-foligno/sintesi-clinica-urs.pdf" { return 301 "$scheme://$host/it/centri/centro-residenziale-santo-stefano-foligno"; }

# --- 2. Tutti i PDF: noindex tranne quelli in elenco; canonical per i duplicati ---
# Le add_header dentro una location annullano quelle del server: si ripetono qui gli header di sicurezza del sito.
location ~* \.pdf$ {
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Referrer-Policy 'strict-origin-when-cross-origin';
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self \"https://cdn.yextapis.com\"), payment=(), usb=(), interest-cohort=(), accelerometer=(), gyroscope=()";
    set $pdf_robots "noindex";
    set $pdf_link "";
    # comunicati stampa: tutta la cartella è indicizzabile (decisione del 1/11)
    if ($uri ~ "^/assets/doc/comunicati/") { set $pdf_robots ""; }
    # --- per nome file (senza distinzione di maiuscole): i tipi da tenere restano indicizzabili anche con un nome nuovo ---
    # carta dei servizi / carta degli alloggi
    if ($uri ~* "/[^/]*cart[ae][ _-]+(dei|degli)[ _-]+(servizi|alloggi)[^/]*\.pdf$") { set $pdf_robots ""; }
    # pieghevole / leaflet
