# --- 3. Curriculum caricati dal modulo di candidatura (dati personali): fuori dai motori, ma raggiungibili ---
# I file restano aperti (la pagina riservata li apre con il link diretto): solo X-Robots-Tag noindex, nofollow, per ogni tipo di file.
# Il prefisso ^~ vince sui blocchi con espressione regolare. Con try_files uguale a quello predefinito, l'elenco della cartella resta 403 come oggi.
location ^~ /assets/doc/cv/ {
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Referrer-Policy 'strict-origin-when-cross-origin';
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self \"https://cdn.yextapis.com\"), payment=(), usb=(), interest-cohort=(), accelerometer=(), gyroscope=()";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ @modx-rewrite;
}
# ===== FINE SEZIONE PDF (KOS-8 / AA-3) =====


# MODX default handler
location / {
    try_files $uri $uri/ @modx-rewrite;
}

location @modx-rewrite {
    rewrite ^/(.*)$ /index.php?q=$1 last;
}
