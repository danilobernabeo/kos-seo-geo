# Regole web di STAGE kosgroup (2026-11-01) = produzione-2026-10-31.conf + sezione PDF in variante stage (KOS-8 / AA-3).
# Generato da scripts/web-rules/stage-da-produzione.py: non modificare a mano. Differenze dalla produzione: noindex + Basic Auth qui sotto,
# niente reindirizzamento di host/schema ($redirect_to), niente robots.txt/llms.txt, sezione PDF senza $redirect_to, redirect verso l'host dello stage.
add_header X-Robots-Tag "noindex, nofollow" always;
auth_basic "Ambiente di prova KOS";
auth_basic_user_file /c0044/www/core/.htpasswd;

# Abusive IP Block added by jay@modx.com on 2025-12-15
if ($remote_addr = 35.198.160.49) {
    return 444;
}

# === Domini migrati: un solo passaggio verso la pagina corrispondente ===
# Devono stare PRIMA dei reindirizzamenti generici (www/http/radice),
# altrimenti le richieste in http vengono intercettate prima.
if ($host = "homecare-academy.kosgroup.com") {
    return 301 $scheme://$host/it/servizi-e-cure/homecare-academy$is_args$args;
}
# (qui andranno i vecchi domini migrati, una regola ciascuno)
#HSTS
add_header Strict-Transport-Security "max-age=31536000";
add_header Referrer-Policy 'strict-origin-when-cross-origin';
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options SAMEORIGIN;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self \"https://cdn.yextapis.com\"), payment=(), usb=(), interest-cohort=(), accelerometer=(), gyroscope=()";

# URL "annidati" generati dai crawler (es. /it/.../it/...): non esistono, 404 senza passare da MODX
if ($uri ~ "^/(it|en)/.+/(it|en)(/|$)") { return 404; }

# Reindirizzamenti in un solo passaggio: www -> senza www, http -> https,
# e radice -> /it, combinati in un'unica destinazione finale.


# Favicon nella radice: serve direttamente il file in /assets/img/, senza reindirizzamento
location = /favicon.ico {
    try_files /assets/img/favicon.ico =404;
    expires 30d;
    access_log off;
}

# Cache del browser: immagini e video cambiano raramente (6 mesi, voce KOS-3)
location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|mp4|webm)$ {
    expires 180d;
    access_log off;
    try_files $uri =404;
}

# Font: 1 anno (voce KOS-3)
location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 365d;
    access_log off;
    try_files $uri =404;
}

# CSS e JS: durata più breve, perché il nome del file non cambia tra una versione e l'altra
location ~* \.(?:css|js)$ {
    expires 180d;
    access_log off;
    try_files $uri =404;
}

