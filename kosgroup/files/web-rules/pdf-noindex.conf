# --- 2. Tutti i PDF: noindex tranne quelli in elenco; canonical per i duplicati ---
# Le add_header dentro una location annullano quelle del server: si ripetono qui gli header di sicurezza del sito.
location ~* \.pdf$ {
    if ($redirect_to) { return 301 $redirect_to; }
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Referrer-Policy 'strict-origin-when-cross-origin';
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self \"https://cdn.yextapis.com\"), payment=(), usb=(), interest-cohort=(), accelerometer=(), gyroscope=()";
    set $pdf_robots "noindex";
    set $pdf_link "";
    # comunicati stampa: tutta la cartella è indicizzabile (decisione del 1/11)
    if ($uri ~ "^/assets/doc/comunicati/") { set $pdf_robots ""; }
    # --- per nome file (senza distinzione di maiuscole): i tipi da tenere restano indicizzabili anche con un nome nuovo ---
    # carta dei servizi / carta degli alloggi
    if ($uri ~* "/[^/]*cart[ae][ _-]+(dei|degli)[ _-]+(servizi|alloggi)[^/]*\.pdf$") { set $pdf_robots ""; }
    # pieghevole / leaflet
    if ($uri ~* "/[^/]*(pieghevole|leaflet)[^/]*\.pdf$") { set $pdf_robots ""; }
    # guida utente / user manual / guida ai servizi
    if ($uri ~* "/[^/]*(guida[ _-]+(utente|ai[ _-]+servizi)|user[ _-]*(manual|guide))[^/]*\.pdf$") { set $pdf_robots ""; }
    # preparazioni
    if ($uri ~* "/preparazion[ie]") { set $pdf_robots ""; }
    # --- PDF indicizzabili (carte dei servizi, pieghevoli, guide, schede di servizio, moduli di accesso) ---
