<div class="col-12 mb-4">
  <article class="card border-0 shadow overflow-hidden">
    <div class="row g-0 align-items-center">
      <div class="col-md-5 p-3">
        <a href="[[+url]]" tabindex="-1" aria-hidden="true">[[+immagine]]</a>
      </div>
      <div class="col-md-7">
        <div class="card-body p-4">
          <p class="card-subtitle text-uppercase small fw-semibold pb-2" style="color: #ce1531;"><time datetime="[[+data_iso]]">[[+data]]</time>[[+luogo:notempty=` · [[+luogo]]`]]</p>
          <h3 class="card-title h4 text-primary mb-2">[[+pagetitle]]</h3>
          [[+sottotitolo:notempty=`<p class="card-text text-brown">[[+sottotitolo]]</p>`]]
          <a class="btn btn-primary text-uppercase mt-2" href="[[+url]]">Per programma e iscrizioni</a>
        </div>
      </div>
    </div>
  </article>
</div>
